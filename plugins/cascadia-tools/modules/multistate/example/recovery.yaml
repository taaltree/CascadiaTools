# Planted-truth recovery at the design of the worked example (Appendix S1).
# The example data (frog_captures.csv, frog_individuals.csv, survey_years.csv)
# were generated by dev/multistate/make_example.R with module$simulate(params, design, seed = 2024);
# the true values are in truth.rds and README_data.md.
# Design: 2 states (uninfected, infected), 8 annual surveys (2015-2022), 40 newly marked
# frogs per survey in 2015-2021 (280 frogs), multievent (swab lost/inconclusive = U).
# Covariates: snout-vent length on survival (individual), mean water temperature on
# infection/recovery (occasion), survey effort on detection (occasion).
# Slopes are on the logit / multinomial-logit scale per 1 SD of the covariate.
# Recovery uses the module's fast_settings (3 chains x 2000 iterations, 700 burn-in).
params:
  survival_uninfected: 0.75
  survival_infected: 0.55
  transition_uninfected_to_infected: 0.30
  transition_infected_to_uninfected: 0.35
  detection_uninfected: 0.6
  detection_infected: 0.5
  assignment_uninfected: 0.75
  assignment_infected: 0.85
  initial_uninfected: 0.65
  initial_infected: 0.35
  survival_beta_svl_mm: 0.4
  transition_beta_water_temp_C_uninfected_to_infected: -0.7
  transition_beta_water_temp_C_infected_to_uninfected: 0.5
  detection_beta_survey_hours: 0.4
design:
  states: [uninfected, infected]
  n_occasions: 8
  n_marked: 40
  model: multievent
  survival_covs: svl_mm
  transition_covs: water_temp_C
  detection_covs: survey_hours
