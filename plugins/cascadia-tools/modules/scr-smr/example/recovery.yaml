# Planted-truth recovery at the design of the worked example (Appendix S1).
# The example data were generated by dev/scr-smr/make_example.R:
#   module$simulate(defaults$params, defaults$design + {model: gsmr,
#   telemetry_fixes: 30, telemetry_fraction: 0.4}, seed = 2025)
# so params and design below reproduce that data-generating process exactly.
params:
  density: 0.25                  # fishers per km2 at average canopy cover
  resight_rate: 0.3              # lambda0: expected photo events per week, camera at the activity centre, off-trail
  sigma: 1000                    # m, spatial scale of movement
  id_probability: 0.8            # P(ear-tag number readable | marked fisher photographed)
  marking_detection: 0.3         # pm0: nightly box-trap capture probability at the activity centre
  density_beta_canopy: 0.5       # log-density change per SD of canopy cover
  detection_beta_on_trail: 0.7   # log-rate effect of a trail camera
design:
  model: gsmr
  resight_model: poisson
  trap_grid_side: 7              # 49 cameras
  trap_spacing: 1500             # m
  n_occasions: 10                # camera weeks
  buffer: 4000                   # m around the cameras
  mask_spacing: 500              # m pixels
  density_covariate: true
  detection_covariate: true
  prop_on_trail: 0.5
  trap_failure: 0.1
  covariate_range: 2000
  telemetry_fixes: 30            # GPS fixes per collared fisher
  telemetry_fraction: 0.4        # share of tagged fishers that were collared
  marking_grid_side: 5           # 25 box traps
  marking_spacing: 1500          # m
  marking_occasions: 5           # trap nights
  marking_offset: [0, 0]
