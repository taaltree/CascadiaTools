# Planted-truth recovery at the design of the SIMULATED shorebird breeding-pair survey
# (shorebird_breeding_pairs.csv, config_state_space.yaml). The example data were generated by
# dev/pva/make_examples.R with set.seed(2024) and these values; dev/pva/si_truth.R checks that
# module$simulate(seed = 2024) reproduces the counts exactly and writes results/pva/si/truth.json.
# The true quasi-extinction risk and true current abundance differ between replicates (each
# replicate has its own final true abundance) and are computed exactly from the true values.
# Run: scripts/ejob -c 16 -m 32 -t 3:00:00 -l logs/pva_si_recover.log -- \
#   scripts/Rscript core/run.R recover pva \
#   --config modules/pva/example/recovery.yaml --nsim 200 --cores 16 \
#   --out results/pva/si/recovery
design:
  model: count
  method: state_space
  n_years: 30            # 1994-2023
  N0: 420                # breeding pairs in 1994
  first_year: 1994
  p_missing: 0.18        # 5 of the 28 interior years were not surveyed in the example
  threshold: 40          # quasi-extinction threshold (breeding pairs)
  horizons: [10, 25]
params:
  mu: -0.04              # mean log growth rate: lambda = exp(-0.04) = 0.961, about -3.9% per year
  sigma2: 0.012          # process (environmental) variance of annual log growth
  tau2: 0.03             # counting-error variance on the log scale (CV about 17%)
settings:
  model: count
  method: state_space
  threshold: 40
  horizons: [10, 25]
