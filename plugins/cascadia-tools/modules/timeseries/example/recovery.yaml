# Planted-truth recovery at the design of the example dataset (herd_counts.csv).
# The example data were generated by dev/timeseries/make_example.R:
#   module$simulate(params = module defaults, design = {model: bayes, n_years: 31,
#   first_year: 1994, covariate_names: snow_depth_cm}, seed = 20), then 3 interior winters
#   (2001, 2009, 2016) were blanked as "not flown". True values: dev/timeseries/example_truth.rds.
# Run: scripts/Rscript core/run.R recover timeseries --config modules/timeseries/example/recovery.yaml --nsim 200
design:
  model: bayes
  n_years: 31                  # 1994-2024
  first_year: 1994
  density_dependence: true
  covariate_names: [snow_depth_cm]
  n_covariates: 1
  frac_missing: 0.1            # round(0.1 x 31) = 3 interior winters not flown, as in the example
  start_N: 500
params:
  density_dependence_b: -0.3   # Gompertz density dependence
  equilibrium_N: 500           # equilibrium herd size (count scale)
  sd_process: 0.10             # real year-to-year variation in log growth
  sd_observation: 0.15         # counting error on the log scale (~16%)
  growth_beta: -0.15           # change in log growth per 1 SD of snow depth
