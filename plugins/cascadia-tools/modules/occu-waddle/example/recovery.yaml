# Planted-truth recovery at the design of the worked example (Appendix S1).
# The example data were generated by dev/occu-waddle/make_example.R
# (set.seed(2010); re-run and checked byte for byte by dev/occu-waddle/si_truth.R).
# The values below are that generator's truth on the module's scale:
# probabilities at the average covariate value, logit slopes per 1 SD.
#
# One approximation: module$simulate() has a single standardised site
# covariate ("habitat") on all three occupancy probabilities and one
# standardised survey covariate ("effort") on both alone-detection
# probabilities. In the example, Cuban treefrog occupancy depends on
# log(distance to road) and green treefrog occupancy on canopy cover (two
# independent covariates), and detection on air temperature. Slopes and
# intercepts are identical; only the covariate shared across the three
# occupancy probabilities differs.
params:
  occ_dominant: 0.525                         # psiA = plogis(0.1): Cuban treefrog at average road distance
  occ_dominant_beta_habitat: -0.9             # per SD of log(distance to road): fewer far from roads
  occ_sub_given_dom_present: 0.2497           # psiBA = plogis(-1.1): green treefrog where Cuban present
  occ_sub_given_dom_present_beta_habitat: 0.6 # per SD of canopy cover
  occ_sub_given_dom_absent: 0.690             # psiBa = plogis(0.8): green treefrog where Cuban absent
  occ_sub_given_dom_absent_beta_habitat: 0.5  # per SD of canopy cover
  det_dominant_alone: 0.550                   # pA at the mean air temperature (25.0 C)
  det_dominant_alone_beta_effort: 0.378       # 0.35 per 2.3 C x SD 2.485 C
  det_sub_alone: 0.600                        # pB at the mean air temperature
  det_sub_alone_beta_effort: 0.270            # 0.25 per 2.3 C x SD 2.485 C
  det_dominant_with_sub: 0.55                 # rA
  det_sub_with_dom_detected: 0.30             # rBA
  det_sub_with_dom_missed: 0.55               # rBa
design:
  n_sites: 180
  n_surveys: 5
  prop_missing: 0.067                         # 60 of 900 visits not done (generator: 6% per visit)
  det_interaction: true
  occ_interaction: true
