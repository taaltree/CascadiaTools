# Planted-truth recovery at the design of the worked bobcat example (Appendix S1).
# The example data were generated by dev/scr/make_example.R (seed 20250601)
# with the true values below; that script places 48 cameras on an 8 x 6 grid
# ~1,600 m apart (with +/-250 m placement jitter), 8 weekly occasions, ~15% of
# cameras failing part-way, a 400 m habitat grid within 5 km of a camera and
# a reservoir (~3% of the grid) that is not habitat.
# The module simulator uses a square detector grid, so the closest square
# design is 7 x 7 = 49 cameras at 1,600 m; everything else matches.
#   scripts/ejob -c 16 -m 32 -t 3:00:00 -l logs/scr_si_recover.log -- \
#     scripts/Rscript core/run.R recover scr --config modules/scr/example/recovery.yaml \
#     --nsim 100 --cores 16 --out results/scr/si/recovery
params:
  density: 0.25                  # bobcats per km2 of habitat at average canopy cover
  baseline_detection: 0.12       # p0: weekly detection prob., camera at the activity centre, off-trail
  sigma: 1300                    # m, spatial scale of movement (95% home range ~31.9 km2)
  density_beta_canopy: 0.45      # log-density change per SD of canopy cover
  detection_beta_on_trail: 1.1   # logit effect of a camera on a road/trail
design:
  obs_model: binomial
  trap_grid_side: 7              # 49 cameras (example: 48 on an 8 x 6 grid)
  trap_spacing: 1600             # m
  n_occasions: 8                 # weeks
  buffer: 5000                   # m of habitat beyond the outer cameras (3.8 sigma)
  mask_spacing: 400              # m pixels
  density_covariate: true        # canopy cover
  covariate_range: 2500          # m, spatial scale of the canopy field
  detection_covariate: true      # on_trail
  prop_on_trail: 0.375           # 18 of 48 example cameras are on a trail
  trap_failure: 0.15             # share of cameras that stop working part-way
  nonhabitat: 0.03               # reservoir share of the state space
