# Planted-truth recovery at the design of the worked example (Appendix S1).
# The example data (sosp_*.csv) were generated by dev/cjs/make_example.R with
# set.seed(2031); the true values are in TRUTH.txt and README_data.md.
# module$simulate() reproduces the same data-generating process at the same design:
#   9 annual occasions (2016-2024), ~72 new adults banded per year in 2016-2023 (575 birds),
#   52% males, 25% transients (never return after the first interval),
#   resident female survival 0.55, male +0.3 logit, recapture 0.45 (female), male +0.5 logit.
# Covariate naming: the simulator's occasion covariate is winter_severity (higher = harsher).
# The example uses mean January minimum temperature (higher = milder) with +0.4 logit per SD,
# which is the same effect as -0.4 logit per SD of severity. Body mass: +0.25 logit per SD.
params:
  survival: 0.55                  # resident female, average mass and winter
  detection_prob: 0.45            # recapture probability, female
  phi_beta_sex_male: 0.3
  phi_beta_winter_severity: -0.4  # = +0.4 per SD of milder (warmer) winters
  phi_beta_body_mass: 0.25
  p_beta_sex_male: 0.5
  prop_transient: 0.25
design:
  n_occasions: 9
  n_marked_per_occasion: 72       # 575 birds / 8 marking years (71.9)
  prop_male: 0.52
  first_year: 2016
  mass_mean: 21.9                 # g (sample mean of sosp_birds.csv)
  mass_sd: 1.66                   # g
  phi_formula: "~ tsm + sex + winter_severity + body_mass"
  p_formula: "~ sex"
settings:
  engine: marked
