# Planted-truth recovery at the design of the bull trout worked example (Appendix S1).
# The example data (bulltrout_microsats.csv, known_relationships.csv) were generated by
# dev/popgen-ne/make_example.R: wf_simulate(Ne = 120, seed 2024) with exactly this design
# (re-run and checked byte for byte by dev/popgen-ne/si_truth.R). Allele sizes in the CSV
# are relabelled fragment lengths; that does not change any estimate.
#
# Mapping to the example: "early" = 2014 adults (50), "late" = 2024 adults (50), kin panel =
# 12 juveniles from 6 redds (6 full-sib pairs, used for relatedness only, use_for_ne = no).
# 2014 -> 2024 at 5 years per generation = 2 generations. Census N = 120 at the first
# sampling (plan I), which the simulator supplies as census_N = Ne.
# Truth: het_loss = 1/(2 Ne) = 0.004167 for LD (both samples) and temporal; full-sib
# relatedness truth is the pedigree relatedness of each replicate's pairs (about 0.48).
params:
  Ne: 120
design:
  marker: msat
  n_loci: 16
  n_alleles: 12
  allele_dirichlet: 0.8
  n_ind: 50
  generations_between: 2
  n_fullsib_pairs: 6
  n_halfsib_pairs: 0
  n_unrelated_pairs: 0
  missing_rate: 0.03
