# Planted-truth recovery at the design of the worked example (Appendix S1).
# The example data (cascades_bird_counts.csv, cascades_stations.csv) were generated by
# dev/community/make_example.R:
#   module$simulate(defaults$params + {group_effect_sd: 0.9, dispersion_mult: 1.4},
#                   defaults$design + the design below, seed = 2026)
# so params and design below reproduce that data-generating process exactly.
# Each recovery replicate draws a NEW species pool (30 species with random niches), so the
# truth of every estimand is recomputed per replicate (population value from 40,000 extra
# sites / 60,000 site pairs; see VALIDATION.md "What truth means"). The example dataset's own
# truths are in example_truth.rds and README_data.md.
# Run:
#   scripts/ejob -c 16 -m 32 -t 3:00:00 -l logs/community_si_recover.log -- \
#     scripts/Rscript core/run.R recover community --config modules/community/example/recovery.yaml \
#     --nsim 200 --cores 16 --out results/community/si/recovery
params:
  n_species: 30          # species pool (30 forest songbirds)
  abund_max: 4           # median peak expected count per station (lognormal)
  abund_sd: 0.8
  tol1: 0.2              # niche width on elevation, as a fraction of the 400-1600 m range
  tol2: 0.4              # niche width on canopy cover, as a fraction of the 10-95% range
  group_effect_sd: 0.9   # SD of species-specific stand-type effects on log abundance
  site_noise_sd: 0.5     # station-to-station extra variation (lognormal SD)
  dispersion_mult: 1.4   # young plantations 1.4x more variable among stations
design:
  n_sites: 60            # 60 point-count stations
  n_groups: 3
  group_sizes: [22, 20, 18]          # old growth, thinned, young plantation
  n_gradients: 2
  env_cor: 0.4                       # correlation between elevation and canopy cover positions
  env_names: [elevation_m, canopy_cover_pct]
  env_ranges: [[400, 1600], [10, 95]]
  group_name: stand_type
  group_levels: [old_growth, thinned, young_plantation]
  effort: 1                          # one 10-min count per station
  data_type: abundance
