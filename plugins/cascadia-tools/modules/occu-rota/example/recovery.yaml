# Planted-truth recovery at the design of the example camera-trap survey
# (Appendix S1 worked example). Run with:
#   scripts/ejob -c 16 -m 32 -t 3:00:00 -l logs/occu-rota_si_recover.log -- scripts/Rscript core/run.R recover occu-rota \
#     --config modules/occu-rota/example/recovery.yaml --nsim 200 --cores 16 --out results/occu-rota/si/recovery
#
# Design = the example data: 2 species (coyote, gray fox), 220 cameras, 6 weekly
# surveys, 7% of camera-weeks not surveyed (0 active days or camera not deployed).
# Truth = the values that generated the example data (dev/occu-rota/make_example.R,
# derived on the module's reporting scale by dev/occu-rota/si/si_truth.R).
#
# module$simulate() has ONE standardised site covariate (named "forest" in its
# output) on every occupancy and interaction term, and ONE survey covariate
# ("effort") on detection. Here the site covariate stands in for log(housing
# density), the covariate that carries the interaction slope in the example, and
# "effort" stands in for days_active. Not reproduced by the simulator: the
# forest-cover effects on occupancy and the on-trail detection effect, so this
# check is slightly optimistic about precision (less site heterogeneity).
design:
  n_species: 2
  species: [coyote, gray_fox]
  n_sites: 220
  n_surveys: 6
  prop_missing: 0.07
  max_order: 2
  interaction_covariate: true
params:
  occ_intercept: [0.49, -0.60]          # coyote (bobcat summed out), gray fox; logit, others absent
  occ_beta_forest: [0.17, 0.30]         # = per-SD effect of log(housing) on each species
  interaction: -0.90                    # coyote:gray_fox log odds ratio (OR 0.41) at average housing
  interaction_beta_forest: 0.60         # = change in log OR per SD of log(housing)
  detection_prob: [0.25, 0.29]          # per week at average effort, off trail
  p_beta_effort: [0.31, 0.31]           # = 0.25 per active day x SD 1.23 days
