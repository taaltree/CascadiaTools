# Same camera-trap survey with all three carnivores. Pairwise interactions
# (max_order 2); the coyote:gray_fox interaction varies with housing density,
# the other two pairs are constant.
data:
  detections: camera_detections.csv
  format: wide_species
  site_col: camera_id
  survey_col: week
  species_cols: [coyote, gray_fox, bobcat]
  surveyed_col: days_active
  obs_covs: [days_active]
  site_covs: camera_sites.csv
  max_order: 2
formulas:
  occupancy: "~ forest_pct + log(housing_per_km2)"
  interaction:
    coyote:gray_fox: "~ log(housing_per_km2)"
    coyote:bobcat: "~ 1"
    gray_fox:bobcat: "~ 1"
  detection: "~ days_active + on_trail"
settings:
  engine: unmarked
  gof_nboot: 200
figures:                      # optional: publication labels (see skills/eco-figures)
  labels:
    coyote: "Coyote"
    gray_fox: "Gray fox"
    bobcat: "Bobcat"
    forest_pct: "Forest cover within 500 m (%)"
    housing_per_km2: "Housing density (units per km²)"
    days_active: "Camera-days active in the week"
    on_trail: "Camera on trail"
