# Planted-truth recovery at the design of the worked mule deer example (Appendix S1).
# The example data were generated by dev/distance/make_example.R (seed 2025); the true
# values below come from dev/distance/si/example_truth.R (results/distance/si/truth.json),
# which re-runs that script and checks it reproduces the example CSVs exactly.
# Example design: 36 north-south line transects, 1.6-4.2 km (mean 3.19 km, 115 km total)
# in a 360 km2 study area split into two 180 km2 strata; truncation 400 m; deer groups of
# 1 + Poisson(2.4) (mean 3.4); half-normal detection, sigma 165 m (observer AB) or 135 m (JK).
# The module simulator gives each transect its own cell (here 3.19 x 3.13 km = 10 km2, so
# 36 cells = 360 km2), equal line lengths and ONE habitat covariate on density. So:
#   - density_beta_habitat = 0.49 is the true shrub-cover effect per transect SD (9.78 %);
#     the weaker road-distance effect (0.22 per SD) is not simulated here;
#   - the two observers' scales are replaced by one sigma (146 m) giving the same average
#     detection probability (P_a 0.456), because the example is fitted with detection "~ 1".
#   scripts/ejob -c 16 -m 32 -t 3:00:00 -l logs/distance_si_recover.log -- \
#     scripts/Rscript core/run.R recover distance --config modules/distance/example/recovery.yaml \
#     --nsim 200 --cores 16 --out results/distance/si/recovery
params:
  group_density_at_average_site: 3.05   # deer groups per km2 at a transect with average habitat
  density_beta_habitat: 0.49            # log-density change per SD of shrub cover (rate ratio 1.63)
  sigma_m: 146                          # half-normal scale (m)
  detection_key: hn
  mean_group_size: 3.4                  # 1 + Poisson(2.4)
design:
  survey: line
  n_transects: 36
  transect_length_km: 3.19
  cell_width_km: 3.13                   # 36 x 3.19 x 3.13 = 360 km2
  truncation_m: 400
  distance_type: exact
  n_strata: 2
  observers: false
