# Planted-truth recovery at the design of the fisher worked example (Appendix S1).
# The example data (fisher_detections.csv, camera_stations.csv) were generated by
# dev/occu-spatial/make_example.R with set.seed(20251). dev/occu-spatial/si_truth.R
# replays that script, confirms it reproduces the CSVs byte-for-byte, and writes the
# true values on the module's (standardised) scale to results/occu-spatial/si/truth.json.
# The parameters below are those true values.
#
# Differences between this simulator and the example's generator (both documented in WALKTHROUGH.md):
#  - covariates: here two independent, partly spatial covariates (80% GP with an 8-km range + 20% noise);
#    in the example canopy and elevation are spatially smooth (6- and 15-km ranges) and weakly correlated (r = -0.22);
#  - missing weeks: here each week after the first is missing at random (6%); in the example cameras
#    failed and stayed off (22 of 160 stations have 2-5 weeks);
#  - days_active: here a standard-normal survey covariate; in the example 91% of weeks are full (7 days).
params:
  occupancy_prob: 0.426             # Pr(occupied) at mean canopy and elevation, spatial effect 0 (logit -0.30)
  psi_beta_canopy_cover_pct: 0.90   # logit occupancy change per 1 SD of canopy cover (12.9 %)
  psi_beta_elevation_m: -0.40       # logit occupancy change per 1 SD of elevation (246 m)
  detection_prob: 0.285             # weekly detection at the mean days_active (6.7 days)
  p_beta_days_active: 0.38          # logit detection change per 1 SD of days_active (1.0 day)
  spatial_variance: 1.0             # sigma^2 of the residual spatial effect (logit scale)
  effective_range_km: 8             # distance at which residual correlation falls to 0.05
  psi_beta_forest: ~                # remove the module's default covariates
  p_beta_effort: ~
design:
  type: single
  n_sites: 160                      # camera stations
  n_surveys: 6                      # weekly occasions
  extent_km: 30                     # 30 x 30 km block
  prop_missing: 0.06                # share of station-weeks with no working camera (example: 57 of 960)
  cov_spatial_frac: 0.8
  cov_range_km: 8
settings:
  model: spPGOcc                    # other settings = module fast_settings (3 x 15000 iter, burn 5000, thin 10, 10 neighbours)
