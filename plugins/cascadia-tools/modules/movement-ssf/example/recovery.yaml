# Planted-truth recovery at the design of the example dataset (elk_gps_2024.csv).
# The example was generated by dev/movement-ssf/make_example.R:
#   module$simulate(defaults$params, defaults$design + {n_animals: 10, n_steps: 540, fix_rate: 1}, seed 2024),
#   then 8% of fixes were blanked at random (failed fixes, seed 99).
# Here the 8% fix loss is simulated directly with fix_rate 0.92.
# Run (one replicate takes ~37 s, so 200 replicates; 2026-10-20, 0 failed):
#   scripts/ejob -c 16 -m 32 -t 3:00:00 -l logs/movement-ssf_si_recover.log -- scripts/Rscript core/run.R recover movement-ssf \
#       --config modules/movement-ssf/example/recovery.yaml --nsim 200 --cores 16 --out results/movement-ssf/si/recovery
params:                     # the true values used to simulate the example
  sel_mean: {forest: 0.8, elevation: -0.5}   # population-mean selection, log-RSS per landscape SD
  sel_sd: {forest: 0.4, elevation: 0.3}      # among-elk SD of selection
  step_shape: 2             # selection-free gamma step length: shape
  step_scale: 120           # ... scale (m); mean step 240 m per 2 h
  turn_kappa: 1             # von Mises turning concentration
  attraction: 0.25          # range residency (per km^2), nuisance
design:
  n_animals: 10             # collared elk
  n_steps: 540              # 2-h steps per elk (45 days, 1 May - 14 June)
  interval_hours: 2
  fix_rate: 0.92            # 8% failed fixes, as in the example CSV
  time_jitter_s: 120
  covariates: [forest, elevation]
settings:                   # same model as config.yaml (recovery skips RSF, home ranges, UHC)
  n_control: 20
  interval_hours: 2
  random_slopes: true
  home_attraction: true
