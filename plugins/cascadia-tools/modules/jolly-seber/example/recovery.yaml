# Planted-truth recovery at the design of the worked example (Appendix S1).
# The example data (turtle_captures.csv, turtle_seasons.csv) were generated by
# dev/jolly-seber/make_example.R from module simulate() with seed 2024; the
# true values are in TRUTH.txt and README_data.md. This file uses the same
# parameters and design, so every replicate is a new pond-turtle study like the example:
#   8 annual occasions (2015-2022), superpopulation 260 turtles, 45% present in 2015,
#   female apparent survival 0.82/yr, male effect -0.4 logit (0.753/yr), 45% males,
#   6% of turtles of unknown sex, capture probability 0.40 at mean effort,
#   effort effect +0.45 logit per SD of trap-nights (mean 120, SD 30).
#
#   scripts/ejob -c 16 -m 32 -t 3:00:00 -l logs/jolly-seber_si_recover.log -- \
#     scripts/Rscript core/run.R recover jolly-seber --config modules/jolly-seber/example/recovery.yaml \
#     --nsim 200 --cores 16 --out results/jolly-seber/si/recovery
params:
  superpopulation_size: 260
  entry_prob_first: 0.45
  survival: 0.82
  survival_beta_male: -0.4
  prop_male: 0.45
  detection: 0.4
  detection_beta_effort: 0.45
design:
  n_occasions: 8
  first_year: 2015
  prop_group_unknown: 0.06
  effort_mean: 120
  effort_sd: 30
