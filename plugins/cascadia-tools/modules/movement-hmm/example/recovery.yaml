# Planted-truth recovery at the design of the worked example (Appendix S1).
# The example data (elk_gps.csv) were generated by dev/movement-hmm/make_example.R:
#   module$simulate(defaults$params, defaults$design + {n_animals: 5, n_fixes: 720,
#   start: "2024-06-01 00:00:00"}, seed = 2024)
# so params and design below reproduce that data-generating process exactly
# (true values also stored in example_truth.rds).
# Run:
#   scripts/ejob -c 16 -m 32 -t 3:00:00 -l logs/movement-hmm_si_recover.log -- \
#     scripts/Rscript core/run.R recover movement-hmm --config modules/movement-hmm/example/recovery.yaml \
#     --nsim 200 --cores 16 --out results/movement-hmm/si/recovery
params:
  step_mean: [60, 450]           # m per hour: encamped, travelling
  step_sd: [50, 300]             # m
  angle_kappa: [0.5, 2.5]        # von Mises turning concentration
  # transition coefficients, order 1->2 (encamped -> travelling), 2->1 (travelling -> encamped)
  tpm_intercept: [-1.6, -1.2]    # log-odds of switching vs staying, at 50% forest, daily-mean hour
  tpm_tod_cos: [-0.9, 0.7]       # time of day (cos of hour)
  tpm_tod_sin: [0.4, -0.3]       # time of day (sin of hour)
  tpm_forest: [-0.025, 0.025]    # per 1% forest cover
  forest_ref: 50                 # % forest at which tpm_intercept applies
design:
  n_animals: 5                   # collared elk
  n_fixes: 720                   # hourly fixes per elk (30 days)
  fix_interval_h: 1
  missing_prop: 0.05             # failed fixes
  jitter_min: 2                  # +/- minutes of fix-time jitter
  landscape_km: 20
  start: "2024-06-01 00:00:00"
settings:
  nstates: 2
