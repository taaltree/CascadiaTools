# Planted-truth recovery at the design of the SIMULATED multi-year example (multiyear_ages.csv,
# config_multiyear.yaml), generated by dev/fisheries-stock/make_multiyear_example.R (seed 2024).
# Run: scripts/ejob -c 16 -m 32 -t 3:00:00 -l logs/fisheries-stock_my_recover.log -- \
#   scripts/Rscript core/run.R recover fisheries-stock --config modules/fisheries-stock/example/recovery_multiyear.yaml \
#   --nsim 200 --cores 16 --out results/fisheries-stock/example_multiyear/recovery
design:
  model: catch_curve
  cc_years: 6            # annual age samples, 2019-2024
  n_fish: 200            # aged fish per year
  max_age: 16
  first_year: 2019
params:
  Z: 0.6                 # total instantaneous mortality (per year)
  recruit_sd_cc: 0.5     # lognormal SD of year-class strength
  sel_age50: 2.3
  sel_slope: 3
settings:
  model: catch_curve
  primary: cohort_glmm
  glmm_interval: reml_t
  bayes: true
  age_full: peak_plus
