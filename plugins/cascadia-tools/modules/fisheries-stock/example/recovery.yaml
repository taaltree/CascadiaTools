# Planted-truth recovery at the design of the SIMULATED walleye catch-curve example
# (walleye_fall_gillnet_ages.csv, config.yaml). The example data were generated by
# dev/fisheries-stock/make_examples.R with module$simulate(seed 42) and these values;
# 350 fish were simulated, 2 otoliths were then set unreadable, so 348 aged fish are fitted.
# Run: scripts/ejob -c 16 -m 32 -t 3:00:00 -l logs/fisheries-stock_si_recover.log -- \
#   scripts/Rscript core/run.R recover fisheries-stock \
#   --config modules/fisheries-stock/example/recovery.yaml --nsim 200 --cores 16 \
#   --out results/fisheries-stock/si/recovery
design:
  model: catch_curve
  n_fish: 348            # aged fish in the example (350 sampled, 2 unreadable otoliths)
  max_age: 20            # oldest age class in the simulated population
params:
  Z: 0.55                # total instantaneous mortality (per year): survival exp(-0.55) = 0.577
  recruit_sd_cc: 0.4     # lognormal SD of year-class strength
  sel_age50: 2.2         # gill-net selectivity: age at 50% vulnerability
  sel_slope: 3           # logistic selectivity slope
settings:
  model: catch_curve
  primary: bayes             # the module default since 2026-10-21 (VALIDATION.md section 5)
  glmm_interval: reml_t
  age_full: peak_plus
  age_full_regression: peak
