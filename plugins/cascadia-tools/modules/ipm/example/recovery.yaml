# Planted-truth recovery at the design of the worked example (Appendix S1).
# The example data (shrike_*.csv, sahel_rainfall.csv) were generated by
# dev/ipm/make_example.R: module simulate() with seed 2024, the module default
# rates and juvenile_survival_beta = +0.4 per SD of Sahel rainfall (1 SD = 90 mm).
# True values: TRUTH.txt and README_data.md. Each replicate below draws a new
# population, marked sample, productivity data and rainfall series from the same
# process at the same design (15 years, ~90 females at the start, 50 nestlings +
# 20 adult females ringed per year, half of all broods monitored, Poisson counts).
# Difference to the example file: the example has one missing count (2013);
# the replicates have all 15 counts. The recovery uses the module's fast MCMC
# settings (3 chains x 35,000 iterations, 5,000 burn-in, thin 6).
params:
  juvenile_survival: 0.25
  adult_survival: 0.48
  fecundity_yearling: 2.8
  fecundity_adult: 3.6
  immigration_rate: 0.12          # median (typical-year) rate; the study-period mean is the reported estimand
  recapture_prob: 0.6
  juvenile_survival_sd: 0.3
  adult_survival_sd: 0.2
  fecundity_yearling_sd: 0.15
  fecundity_adult_sd: 0.15
  immigration_sd: 0.3
  juvenile_survival_beta: 0.4     # logit scale, per 1 SD of Sahel rainfall
design:
  n_years: 15
  first_year: 2006
  N_initial: 90
  marked_juveniles: 50
  marked_adults: 20
  prop_broods_monitored: 0.5
  count_model: poisson
  immigration: true
  age_specific_fecundity: true
  temporal_variation: true
  covariate: true
  covariate_name: sahel_rain_mm
  sex_ratio: 0.5
